<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3trees シフト調整</title>
<style>
:root{--bg:#0f1117;--s1:#1a1d27;--s2:#22263a;--bd:#2a2f4a;--ac:#5b8cff;--gr:#3ddc84;--am:#f5a623;--re:#ff5566;--tx:#e8eaf0;--mu:#6b7299}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans",sans-serif;font-size:14px;min-height:100vh;padding-bottom:40px}
button{font-family:inherit;cursor:pointer}

/* SETUP */
#setup{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.setup-card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:28px;width:100%;max-width:480px}
.setup-card h1{font-size:18px;font-weight:800;margin-bottom:6px}
.setup-card h1 span{color:var(--ac)}
.setup-desc{font-size:13px;color:var(--mu);line-height:1.7;margin-bottom:20px}
.setup-desc b{color:var(--am)}
.setup-label{font-size:12px;color:var(--mu);font-weight:600;margin-bottom:6px}
#url-input{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:13px;outline:none;margin-bottom:12px;font-family:inherit}
#connect-btn{width:100%;background:var(--ac);color:#fff;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:700}
#setup-err{margin-top:10px;font-size:13px;color:var(--re);font-weight:600;min-height:20px}

/* APP */
#app{display:none}

/* TOAST */
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-weight:700;font-size:13px;z-index:200;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.5);display:none}

/* HEADER */
#header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--bd);padding:14px 16px 10px}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.header-title{font-size:16px;font-weight:800}
.header-title span{color:var(--ac)}
.header-meta{font-size:11px;color:var(--mu);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
#summary-btn{background:var(--ac);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;flex-shrink:0}

/* 月切り替え */
#month-bar{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--s2)}
.month-nav{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:8px;width:36px;height:36px;font-size:18px;display:flex;align-items:center;justify-content:center}
#month-label{font-size:17px;font-weight:800;min-width:100px;text-align:center}

/* DIAG */
#diag{display:none;margin-top:8px;background:#0a0c14;border:1px solid var(--bd);border-radius:8px;padding:8px;max-height:150px;overflow-y:auto}
.diag-line{font-size:10px;font-family:monospace;line-height:1.6}

/* LEGEND */
#legend{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--bd)}
.leg{background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--mu)}
.leg b{color:var(--ac)}

/* TABS */
#tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--bd);-webkit-overflow-scrolling:touch}
#tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1.5px solid var(--bd);background:var(--s2);color:var(--mu);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.tab.active{background:var(--ac);border-color:var(--ac);color:#fff}
.badge{background:rgba(61,220,132,.2);color:var(--gr);border-radius:4px;padding:1px 5px;font-size:10px;font-weight:700}

/* CARD */
#card-wrap{padding:12px 16px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.card-head{padding:12px 14px;background:var(--s2);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-name{font-size:17px;font-weight:700}
.card-stats{font-size:12px;color:var(--mu);margin-top:2px;display:flex;gap:12px;flex-wrap:wrap}
.confirmed-badge{background:rgba(61,220,132,.12);border:1px solid var(--gr);color:var(--gr);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700}
#confirm-btn{background:var(--gr);color:#0f1117;border:none;border-radius:8px;padding:8px 20px;font-size:14px;font-weight:800;box-shadow:0 0 16px rgba(61,220,132,.3)}
#edit-btn{background:transparent;border:1px solid var(--bd);color:var(--mu);border-radius:8px;padding:6px 12px;font-size:12px}
.card-notice{padding:10px 14px;background:rgba(61,220,132,.06);border-top:1px solid var(--bd);font-size:12px;color:var(--gr);text-align:center}

/* GRID */
.grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--bd)}
th.lbl{min-width:72px;text-align:left;padding:6px 12px;font-size:10px;color:var(--mu);position:sticky;left:0;background:var(--s2);z-index:5}
th.day{min-width:33px;text-align:center;padding:5px 1px;font-size:10px}
td.lbl{padding:5px 12px;position:sticky;left:0;background:var(--s1);z-index:3;border-right:1px solid var(--bd)}
td.lbl.ot{background:rgba(245,166,35,.06)}
td.cell{text-align:center;padding:2px 1px}
.sat{background:rgba(91,140,255,.08)}
.sun{background:rgba(255,85,102,.08)}
button.ox{width:28px;height:28px;border-radius:6px;border:1.5px solid var(--bd);background:transparent;color:transparent;font-size:14px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-family:inherit}
button.ox.m{background:rgba(61,220,132,.12);border-color:var(--gr);color:var(--gr)}
button.ox.x{background:rgba(255,85,102,.12);border-color:var(--re);color:var(--re)}
button.ox.o{background:rgba(245,166,35,.15);border-color:var(--am);color:var(--am)}
button.ox:disabled{opacity:.65;cursor:default}

/* STATUS */
#status-wrap{padding:0 16px 8px}
.status-card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.status-head{padding:10px 14px;background:var(--s2);border-bottom:1px solid var(--bd);font-size:12px;font-weight:700;color:var(--mu)}
.status-row{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;flex-wrap:wrap;gap:4px}
.status-row:not(:last-child){border-bottom:1px solid var(--bd)}
.status-name{display:flex;align-items:center;gap:10px;font-weight:600}
.status-stats{display:flex;gap:10px;font-size:12px;color:var(--mu);flex-wrap:wrap;justify-content:flex-end}
.st-badge{border-radius:5px;padding:2px 8px;font-size:11px;font-weight:700}

/* MODAL */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:flex-end}
#modal-overlay.open{display:flex}
#modal{background:var(--s1);border-radius:20px 20px 0 0;padding:20px 16px 36px;width:100%;max-height:80vh;overflow-y:auto}
#modal h2{font-size:15px;font-weight:700;margin-bottom:14px}
#summary-text{width:100%;height:260px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px;font-size:12px;font-family:monospace;resize:none;line-height:1.7}
.modal-btns{display:flex;gap:8px;margin-top:12px}
.modal-btns button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font-size:14px;font-weight:600}
.modal-btns .cp{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
</style>
</head>
<body>

<div id="setup">
  <div class="setup-card">
    <h1>3trees <span>シフト調整</span></h1>
    <p class="setup-desc">Google Apps Script の Web App URL を貼り付けてください。<br><b>script.google.com → デプロイ → ウェブアプリ → URLをコピー</b></p>
    <div class="setup-label">Web App URL</div>
    <input id="url-input" type="url" placeholder="https://script.google.com/macros/s/...../exec">
    <button id="connect-btn" onclick="connect()">接続して開始</button>
    <div id="setup-err"></div>
  </div>
</div>

<div id="app">
  <div id="toast"></div>

  <div id="header">
    <div class="header-row">
      <div>
        <div class="header-title">3trees <span>シフト調整</span></div>
        <div class="header-meta">
          <span id="confirmed-count">確定 0/5名</span>
          <span style="display:flex;align-items:center;gap:4px">
            <span class="dot" id="save-dot" style="background:var(--bd)"></span>
            <span id="save-label">—</span>
          </span>
          <button onclick="reload()" style="background:transparent;border:1px solid var(--bd);color:var(--mu);border-radius:6px;padding:2px 8px;font-size:11px">🔄 更新</button>
          <button onclick="toggleDiag()" style="background:transparent;border:1px solid var(--bd);color:var(--mu);border-radius:6px;padding:2px 8px;font-size:11px">🔍 診断</button>
          <button onclick="changeUrl()" style="background:transparent;border:1px solid var(--bd);color:var(--mu);border-radius:6px;padding:2px 8px;font-size:11px">⚙ URL変更</button>
        </div>
      </div>
      <button id="summary-btn" onclick="openModal()">まとめ</button>
    </div>
    <div id="diag"></div>
  </div>

  <!-- 月切り替えバー -->
  <div id="month-bar">
    <button class="month-nav" onclick="changeMonth(-1)">‹</button>
    <div id="month-label"></div>
    <button class="month-nav" onclick="changeMonth(1)">›</button>
  </div>

  <div id="legend"></div>
  <div id="tabs"></div>
  <div id="card-wrap"></div>
  <div id="status-wrap"></div>
</div>

<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal">
    <h2 id="modal-title">📋 シフトまとめ</h2>
    <textarea id="summary-text" readonly></textarea>
    <div class="modal-btns">
      <button onclick="closeModal()">閉じる</button>
      <button class="cp" onclick="copyText()">コピー</button>
    </div>
  </div>
</div>

<script>
const SHIFTS=[
  {k:"A",label:"A",time:"19:00-3:00",ot:false},
  {k:"B",label:"B",time:"19:00-23:30",ot:false},
  {k:"C",label:"C",time:"20/21-1/2:00",ot:false},
  {k:"D",label:"D",time:"22:00-3:00",ot:false},
  {k:"OT",label:"残業可",time:"",ot:true},
];
const NAMES=["まゆこ","まゆ","春希","喜歩","あゆむ"];
const URL_LS="shift3trees_gasurl";
const WD=["日","月","火","水","木","金","土"];

let GAS_URL="";
let curYear=2026, curMonth=8;   // 初期月
let all={};
let currentTab=0;
let diagLines=[];
let showDiag=false;

// ── 月ユーティリティ ───────────────────────────
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function monthKey(y,m){ return y+"_"+String(m).padStart(2,"0"); }
function dayWd(d){ return WD[new Date(curYear,curMonth-1,d).getDay()]; }
function dayType(d){ const w=new Date(curYear,curMonth-1,d).getDay(); return w===0?"sun":w===6?"sat":""; }
function nextVal(cur,ot){ if(ot) return cur==="o"?null:"o"; return cur===null?"o":cur==="o"?"x":null; }
function cntWork(data){ let n=0; const days=daysInMonth(curYear,curMonth); for(let d=0;d<days;d++) if(["A","B","C","D"].some(k=>data[k][d]==="o"))n++; return n; }
function cntOT(data){ return data.OT.filter(v=>v==="o").length; }

function initAll(){
  const days=daysInMonth(curYear,curMonth);
  const o={};
  NAMES.forEach(n=>{
    const d={};
    SHIFTS.forEach(s=>{ d[s.k]=Array(days).fill(null); });
    o[n]={data:d,confirmed:false,confirmedAt:null};
  });
  return o;
}

// ── GAS通信 ───────────────────────────────────
function gasUrl(extra){
  return GAS_URL+"?month="+monthKey(curYear,curMonth)+"&t="+Date.now()+(extra||"");
}
async function gasGet(){
  const r=await fetch(gasUrl());
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j=await r.json();
  if(j.error) throw new Error("GAS: "+j.error);
  return j;
}
async function gasPost(data){
  const params=new URLSearchParams();
  params.append("month", monthKey(curYear,curMonth));
  params.append("data", JSON.stringify(data));
  const r=await fetch(GAS_URL,{
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:params.toString(),
    redirect:"follow",
  });
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j=await r.json();
  if(j.error) throw new Error("GAS: "+j.error);
  if(!j.ok) throw new Error("save failed");
  return j.saved;
}

// ── ログ・UI ─────────────────────────────────
function addLog(msg,t="info"){
  const ts=new Date().toLocaleTimeString("ja-JP");
  diagLines.unshift({ts,msg,t});
  if(diagLines.length>40) diagLines.pop();
  if(showDiag) renderDiag();
}
function renderDiag(){
  const el=document.getElementById("diag");
  el.innerHTML=diagLines.map(l=>`<div class="diag-line" style="color:${l.t==="ok"?"var(--gr)":l.t==="err"?"var(--re)":"var(--mu)"}">[${l.ts}] ${l.msg}</div>`).join("")||'<div class="diag-line" style="color:var(--mu)">ログなし</div>';
}
function toggleDiag(){
  showDiag=!showDiag;
  const el=document.getElementById("diag");
  el.style.display=showDiag?"block":"none";
  if(showDiag) renderDiag();
}
function setSave(st){
  const map={idle:["var(--bd)","—"],saving:["var(--am)","保存中…"],ok:["var(--gr)","保存済み ✓"],err:["var(--re)","保存失敗 ✗"]};
  const [c,l]=map[st]||map.idle;
  document.getElementById("save-dot").style.background=c;
  const lbl=document.getElementById("save-label");
  lbl.textContent=l; lbl.style.color=c;
}
function toast(msg,t="ok"){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.style.background=t==="err"?"var(--re)":t==="info"?"var(--am)":"var(--gr)";
  el.style.color=t==="info"?"#000":"#fff";
  el.style.display="block";
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>el.style.display="none",2800);
}

// ── 月切り替え ────────────────────────────────
async function changeMonth(delta){
  curMonth+=delta;
  if(curMonth>12){curMonth=1;curYear++;}
  if(curMonth<1){curMonth=12;curYear--;}
  all=initAll();
  renderAll();
  await reload();
}

// ── ロード・保存 ──────────────────────────────
async function reload(){
  addLog(monthKey(curYear,curMonth)+" 読み込み中...");
  setSave("saving");
  try{
    const saved=await gasGet();
    if(saved&&typeof saved==="object"&&Object.keys(saved).length>0){
      // 現在の日数に合わせてデータをマージ
      const days=daysInMonth(curYear,curMonth);
      NAMES.forEach(n=>{
        if(!saved[n]) return;
        all[n].confirmed=saved[n].confirmed||false;
        all[n].confirmedAt=saved[n].confirmedAt||null;
        SHIFTS.forEach(s=>{
          if(saved[n].data&&saved[n].data[s.k]){
            all[n].data[s.k]=saved[n].data[s.k].slice(0,days);
            while(all[n].data[s.k].length<days) all[n].data[s.k].push(null);
          }
        });
      });
      addLog("読み込み成功","ok");
    } else {
      addLog("データなし（初回）");
    }
    setSave("ok");
    renderAll();
  }catch(e){
    addLog("読み込みエラー: "+e.message,"err");
    setSave("err");
    toast("読み込み失敗: "+e.message,"err");
  }
}

let saveTimer=null;
async function save(snapshot){
  setSave("saving");
  addLog("保存中...");
  try{
    const saved=await gasPost(snapshot);
    const ok=NAMES.every(n=>saved[n]&&saved[n].confirmed===snapshot[n].confirmed);
    if(ok){ addLog("保存 ✓","ok"); setSave("ok"); }
    else throw new Error("検証不一致");
  }catch(e){
    addLog("保存エラー: "+e.message,"err");
    setSave("err");
    toast("保存失敗: "+e.message,"err");
  }
}
function schedSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>save(all),400); }

// ── 操作 ─────────────────────────────────────
function toggle(name,sk,di){
  if(all[name].confirmed) return;
  const ot=sk==="OT";
  all[name].data[sk][di]=nextVal(all[name].data[sk][di],ot);
  renderCard(); schedSave();
}
function confirmShift(){
  const name=NAMES[currentTab];
  all[name].confirmed=true;
  all[name].confirmedAt=new Date().toLocaleString("ja-JP");
  addLog(name+" 確定");
  toast(name+"さんのシフトを確定しました ✓");
  renderAll(); save(all);
}
function editShift(){
  const name=NAMES[currentTab];
  all[name].confirmed=false;
  renderAll(); save(all);
  toast(name+"さんを編集モードに戻しました","info");
}

// ── レンダリング ──────────────────────────────
function renderAll(){
  document.getElementById("month-label").textContent=curYear+"年"+curMonth+"月";
  document.title="3trees シフト "+curYear+"年"+curMonth+"月";
  renderHeader(); renderLegend(); renderTabs(); renderCard(); renderStatus();
}
function renderHeader(){
  const cnt=NAMES.filter(n=>all[n].confirmed).length;
  document.getElementById("confirmed-count").textContent="確定 "+cnt+"/"+NAMES.length+"名";
}
function renderLegend(){
  document.getElementById("legend").innerHTML=SHIFTS.filter(s=>!s.ot)
    .map(s=>`<div class="leg"><b>${s.k}</b> ${s.time}</div>`).join("");
}
function renderTabs(){
  document.getElementById("tabs").innerHTML=NAMES.map((n,i)=>`
    <button class="tab${i===currentTab?" active":""}" onclick="setTab(${i})">
      ${n}${all[n].confirmed?'<span class="badge">確定</span>':""}
    </button>`).join("");
}
function setTab(i){ currentTab=i; renderTabs(); renderCard(); }

function renderCard(){
  const name=NAMES[currentTab];
  const emp=all[name];
  const locked=emp.confirmed;
  const days=daysInMonth(curYear,curMonth);
  let html=`<div class="card">
  <div class="card-head">
    <div>
      <div class="card-name">${name}</div>
      <div class="card-stats">
        <span>出勤 <b style="color:var(--gr)">${cntWork(emp.data)}</b>日</span>
        <span>残業可 <b style="color:var(--am)">${cntOT(emp.data)}</b>日</span>
        ${emp.confirmedAt?`<span style="font-size:11px">確定:${emp.confirmedAt}</span>`:""}
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      ${locked
        ?`<div class="confirmed-badge">✓ 確定済み</div><button id="edit-btn" onclick="editShift()">修正</button>`
        :`<button id="confirm-btn" onclick="confirmShift()">確定する</button>`}
    </div>
  </div>
  <div class="grid-wrap"><table>
  <thead><tr><th class="lbl">シフト</th>`;
  for(let d=1;d<=days;d++){
    const t=dayType(d);
    html+=`<th class="day${t?" "+t:""}">
      <span style="display:block;font-weight:700;font-size:11px;color:${t==="sun"?"var(--re)":t==="sat"?"#7aaaff":"var(--tx)"}">${d}</span>
      <span style="display:block;font-size:9px;color:${t==="sun"?"var(--re)":t==="sat"?"#7aaaff":"var(--mu)"}">${dayWd(d)}</span>
    </th>`;
  }
  html+=`</tr></thead><tbody>`;
  SHIFTS.forEach((s,si)=>{
    html+=`<tr style="${si===SHIFTS.length-1?"border-bottom:none":""}${s.ot?";background:rgba(245,166,35,.03)":""}">
    <td class="lbl${s.ot?" ot":""}">
      ${s.ot?`<span style="font-size:11px;font-weight:600;color:var(--am)">🔆 残業可</span>`
             :`<span style="font-size:13px;font-weight:700;color:var(--ac)">${s.k}</span><span style="display:block;font-size:9px;color:var(--mu)">${s.time}</span>`}
    </td>`;
    for(let di=0;di<days;di++){
      const t=dayType(di+1);
      const val=emp.data[s.k][di];
      let cls="ox",lbl="";
      if(val==="o"){cls=s.ot?"ox o":"ox m";lbl="○";}
      if(val==="x"){cls="ox x";lbl="×";}
      html+=`<td class="cell${t?" "+t:""}"><button class="${cls}" ${locked?"disabled":""} onclick="toggle('${name}','${s.k}',${di})">${lbl}</button></td>`;
    }
    html+=`</tr>`;
  });
  html+=`</tbody></table></div>${locked?`<div class="card-notice">✓ 確定済み — 修正する場合は「修正」ボタンを押してください</div>`:""}</div>`;
  document.getElementById("card-wrap").innerHTML=html;
}

function renderStatus(){
  let html=`<div class="status-card"><div class="status-head">全員の状況 — ${curYear}年${curMonth}月</div>`;
  NAMES.forEach((n,i)=>{
    const e=all[n];
    html+=`<div class="status-row" onclick="setTab(${i})" style="${currentTab===i?"background:rgba(91,140,255,.06)":""}">
      <div class="status-name"><div class="dot" style="background:${e.confirmed?"var(--gr)":"var(--bd)"}"></div>${n}</div>
      <div class="status-stats">
        <span>出勤 <b style="color:var(--tx)">${cntWork(e.data)}</b>日</span>
        <span>残業可 <b style="color:var(--am)">${cntOT(e.data)}</b>日</span>
        <span class="st-badge" style="background:${e.confirmed?"rgba(61,220,132,.12)":"rgba(255,85,102,.1)"};color:${e.confirmed?"var(--gr)":"var(--re)"}">${e.confirmed?"確定":"未確定"}</span>
      </div>
    </div>`;
  });
  document.getElementById("status-wrap").innerHTML=html+"</div>";
}

// ── まとめ ────────────────────────────────────
function buildSummary(){
  const days=daysInMonth(curYear,curMonth);
  let lines=[`【3trees シフト希望　${curYear}年${curMonth}月】\n`];
  NAMES.forEach(name=>{
    const e=all[name];
    lines.push("■ "+name+"　"+(e.confirmed?"✓確定 ("+e.confirmedAt+")":"（未確定）"));
    lines.push("  出勤"+cntWork(e.data)+"日 / 残業可"+cntOT(e.data)+"日");
    SHIFTS.forEach(s=>{
      const d=e.data[s.k].map((v,i)=>v==="o"?i+1:null).filter(Boolean);
      if(d.length) lines.push("  "+(s.ot?"残業可":s.label)+"："+d.join(", ")+"日");
    });
    const ng=[];
    for(let i=0;i<days;i++) if(["A","B","C","D"].every(k=>e.data[k][i]!=="o")&&["A","B","C","D"].some(k=>e.data[k][i]==="x")) ng.push(i+1);
    if(ng.length) lines.push("  ×不可日："+ng.join(", ")+"日");
    lines.push("");
  });
  return lines.join("\n");
}
function openModal(){
  const cnt=NAMES.filter(n=>all[n].confirmed).length;
  document.getElementById("modal-title").textContent="📋 シフトまとめ（"+curYear+"年"+curMonth+"月 / 確定 "+cnt+"/"+NAMES.length+"名）";
  document.getElementById("summary-text").value=buildSummary();
  document.getElementById("modal-overlay").classList.add("open");
}
function closeModal(){ document.getElementById("modal-overlay").classList.remove("open"); }
function copyText(){
  navigator.clipboard.writeText(document.getElementById("summary-text").value)
    .then(()=>{ toast("コピーしました"); closeModal(); });
}

// ── セットアップ ──────────────────────────────
async function connect(){
  const url=document.getElementById("url-input").value.trim();
  const errEl=document.getElementById("setup-err");
  errEl.textContent="";
  if(!url.startsWith("https://script.google.com")){errEl.textContent="URLが正しくありません";return;}
  document.getElementById("connect-btn").textContent="接続中…";
  GAS_URL=url;
  try{
    all=initAll();
    await reload();
    localStorage.setItem(URL_LS,url);
    document.getElementById("setup").style.display="none";
    document.getElementById("app").style.display="block";
  }catch(e){
    errEl.textContent="接続失敗: "+e.message;
    document.getElementById("connect-btn").textContent="接続して開始";
    GAS_URL="";
  }
}
function changeUrl(){
  GAS_URL="";
  localStorage.removeItem(URL_LS);
  document.getElementById("url-input").value="";
  document.getElementById("setup-err").textContent="";
  document.getElementById("connect-btn").textContent="接続して開始";
  document.getElementById("setup").style.display="flex";
  document.getElementById("app").style.display="none";
}

// ── 起動 ─────────────────────────────────────
(async function(){
  // 今月を初期値に設定
  const now=new Date();
  curYear=now.getFullYear();
  curMonth=now.getMonth()+1;

  const saved=localStorage.getItem(URL_LS);
  if(saved){
    document.getElementById("url-input").value=saved;
    GAS_URL=saved;
    try{
      all=initAll();
      document.getElementById("setup").style.display="none";
      document.getElementById("app").style.display="block";
      renderAll();
      await reload();
    }catch(e){
      addLog("起動エラー: "+e.message,"err");
      document.getElementById("setup").style.display="flex";
      document.getElementById("app").style.display="none";
    }
  }
})();
</script>
